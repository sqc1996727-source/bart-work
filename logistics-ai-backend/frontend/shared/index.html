<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="dark"><title>企业 AI 工作台</title>
<link rel="stylesheet" href="/workspace/workspace.css"></head><body>
<div class="preview"><div class="viewport"><div class="app" id="app"><div class="shell"><aside class="sidebar" id="sidebar"></aside><main class="main"><header class="top"><button class="iconbtn mobileonly" id="menuBtn" aria-label="打开导航" onclick="openSheet('menu',this)"></button><div><h1 id="title">工作空间</h1><small id="organizationName">企业工作空间</small></div><div class="grow"></div><button class="iconbtn" id="newBtn" aria-label="新建工作" title="新建工作" onclick="go('new')"></button><button class="iconbtn" id="historyBtn" aria-label="工作记录" title="工作记录" onclick="go('history')"></button></header><section class="canvas" id="canvas"><div class="ambient"></div><div class="grain"></div><div class="canvashead"><span id="agentIcon"></span><span>智能协作</span><div class="grow"></div><div class="status"><span class="statusdot" id="statusdot"></span><span id="status">工作就绪</span></div></div><div class="content" id="content"></div><div class="bottom"><div class="suggestions" id="suggestions"></div><form class="composer" onsubmit="send(event)"><button type="button" id="attachBtn" aria-label="选择附件" onclick="document.getElementById('file').click()"></button><input id="file" type="file" hidden onchange="attach(this)"><span style="height:20px;width:1px;background:#b4a5ca30"></span><input id="prompt" autocomplete="off" placeholder="交代一项工作…" aria-label="工作指令"><button class="send" id="sendBtn" aria-label="发送"></button></form><div class="fine" id="fine">连接企业服务…</div></div></section><nav class="mobile-tabs" id="mobileTabs" aria-label="底部导航"></nav></main></div>
<div class="overlay" id="overlay" aria-hidden="true" onclick="if(event.target===this)closeSheet()"><section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="业务成果"></section></div><div class="toast" id="toast" role="status"></div></div></div></div>
<script src="/workspace/shell.js"></script><script src="/workspace/live.js"></script></body></html>
