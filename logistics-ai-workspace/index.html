<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作空间 · 03.1</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#e9e9ef;font:12px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}button,input,select{font:inherit;color:inherit}button{cursor:pointer}.desktop{background:radial-gradient(ellipse at 24% 5%,#c8cfde,#9ba5b8 48%,#606b81);padding:24px 14px 28px;border-radius:9px}.window{display:flex;gap:8px;padding:9px;background:#0c0c10;border:1px solid #62646f;border-radius:15px;box-shadow:0 25px 40px -16px #152039b0;min-height:565px}.left{width:136px;flex-shrink:0;padding:12px 7px;display:flex;flex-direction:column;gap:5px}.brand{display:flex;align-items:center;gap:8px;margin:0 0 24px;font-size:13px;font-weight:550;letter-spacing:.3px}.logo{width:24px;height:24px;border:1px solid #9498ad;border-radius:7px;display:grid;place-items:center;background:linear-gradient(145deg,#777e90,#222633 65%);box-shadow:inset 0 1px 1px #ffffff55}.logo svg{width:15px;height:15px}.left button{display:flex;gap:8px;align-items:center;text-align:left;border:0;background:none;padding:9px 7px;border-radius:6px;font-size:11px;color:#92939e}.left button:hover,.left button.active{background:#22232d;color:#eeeef3}.left button.new{border:1px solid #3a3a47;background:linear-gradient(#292933,#191a22);color:#e6e7ee;margin-bottom:12px;box-shadow:inset 0 1px 0 #ffffff12}.navlabel{color:#656773;font-size:10px;padding:15px 7px 4px}.left svg,.right svg,.composer svg{width:15px;height:15px;flex-shrink:0}.profile{margin-top:auto;padding-top:12px;border-top:1px solid #282831;display:flex;align-items:center;gap:8px}.avatar{width:26px;height:26px;border-radius:7px;background:linear-gradient(145deg,#505666,#222632);display:grid;place-items:center;font-size:11px}.profile select{border:0;background:#101016;color:#b8bac5;font-size:11px;max-width:91px}.center{min-width:0;flex:1;display:flex;flex-direction:column}.top{height:46px;display:flex;align-items:center;gap:9px;padding:0 7px 8px}.top h1{font-size:15px;font-weight:500;margin:0;letter-spacing:.2px}.top small{font-size:10px;color:#7c7e8b;display:block;margin-top:5px}.grow{flex:1}.top button{border:0;background:none;color:#9e9fae;padding:5px;font-size:16px}.canvas{flex:1;min-height:490px;display:flex;flex-direction:column;position:relative;isolation:isolate;overflow:hidden;padding:17px;border-radius:11px;border:1px solid #414157;border-top-color:#65657c;background:radial-gradient(ellipse at 55% -18%,#56536e,#303047 28%,#1b1c2e 50%,#11121b 90%);box-shadow:inset 0 1px 0 #d6d4ef12}.canvas:before{content:"";position:absolute;inset:0;z-index:-1;background-image:radial-gradient(circle,#c5c9e14a .5px,transparent 1px),radial-gradient(circle,#b1b6cf38 .5px,transparent 1px);background-size:47px 53px,79px 83px;background-position:7px 17px,21px 33px;mask-image:linear-gradient(#000,transparent 90%)}.agent{display:flex;justify-content:center;align-items:center;gap:7px;color:#c6c7d7;font-size:11px;letter-spacing:.4px;margin-bottom:25px}.light{height:6px;width:6px;border-radius:50%;background:#bccce9;box-shadow:0 0 10px #b0c7ff99;flex-shrink:0}.time{font-size:10px;color:#aaaabc;margin:0 0 11px;font-weight:400;letter-spacing:.4px}.glass{border:1px solid #c9c7df27;border-top-color:#d3d1e049;background:linear-gradient(140deg,#9291af29,#8d8da209);border-radius:10px;backdrop-filter:blur(16px);box-shadow:0 7px 20px #08091433;padding:16px}.glass h2{margin:0 0 11px;font-size:22px;font-weight:450;letter-spacing:-.3px;line-height:1.45}.glass p{font-size:12px;line-height:1.9;color:#c7c6d5;margin:0 0 17px}.numbers{border-top:1px solid #ccd0e11d;padding-top:14px;display:flex;gap:12px}.numbers>div{flex:1;min-width:0}.numbers strong{display:block;color:#f1f0f7;font:400 26px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-1.5px}.numbers small{display:block;margin-top:6px;color:#a8a9bb;font-size:10px}.itemslabel{font-size:10px;letter-spacing:.5px;color:#a3a3b8;margin:22px 0 9px}.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid #babbd42a;border-top-color:#b7bad34a;border-radius:7px;background:linear-gradient(110deg,#48465f91,#292a3bb8);box-shadow:0 4px 9px #08081522;padding:10px;margin-bottom:8px}.item:hover{border-color:#a7abc878;background:#41425b}.itemicon{width:30px;height:30px;flex-shrink:0;display:grid;place-items:center;border:1px solid #a3a8c436;border-radius:7px;background:linear-gradient(140deg,#9b9eb943,#45485d40);color:#d5d9e9}.itemicon svg{width:17px;height:17px}.item b{font-size:12px;font-weight:500}.item small{display:block;font-size:10px;line-height:1.5;margin-top:5px;color:#a6a7bc}.amount{font:12px ui-monospace,SFMono-Regular,monospace;color:#e0c5b3;white-space:nowrap}.arrow{font-size:17px;color:#b2b3c5}.note{font-size:11px;color:#9497ac;line-height:1.8;margin:12px 0 15px}.bottom{margin-top:auto;padding-top:12px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}.chips button{font-size:10px;color:#babed3;background:#bac3dc0c;border:1px solid #a2abc12c;border-radius:5px;padding:5px 8px}.chips button:hover{background:#b5bdd22d}.composer{display:flex;gap:8px;align-items:center;border:1px solid #a2a3bd49;border-top-color:#c5c5dc60;border-radius:9px;background:linear-gradient(#b5b5d12e,#8e91b019);backdrop-filter:blur(20px);padding:8px;box-shadow:inset 0 1px 8px #ffffff09,0 5px 12px #0003}.composer input{background:none;border:0;outline:none;width:100%;min-width:0;font-size:12px;letter-spacing:.3px}.composer input::placeholder{color:#a3a2b6}.add{border:0;background:none;color:#b8bbce;font-size:18px}.send{width:29px;height:28px;flex-shrink:0;display:grid;place-items:center;border:1px solid #e5e6ee;background:linear-gradient(#f2f3f8,#c3c6d4);border-radius:6px;color:#292b39}.right{width:166px;flex-shrink:0;padding:15px 11px;border:1px solid #38383f;border-top-color:#51515c;background:linear-gradient(145deg,#1e1e25,#15151b 80%);border-radius:10px;display:flex;flex-direction:column}.right h3{font-size:13px;font-weight:500;margin:0 0 15px}.module{display:flex;align-items:center;gap:7px;background:linear-gradient(135deg,#484753,#2a2934);border:1px solid #a9aac142;border-radius:7px;padding:10px 7px;font-size:11px}.tabs{display:flex;gap:13px;border-bottom:1px solid #363640;margin:16px 0 19px}.tabs button{padding:8px 0;border:0;border-bottom:1px solid transparent;background:none;color:#81828f;font-size:10px}.tabs button.active{border-color:#cdcedb;color:#e4e5ee}.group{color:#797b8a;font-size:10px;margin-bottom:15px}.tool{display:flex;align-items:center;gap:8px;margin-bottom:19px;font-size:11px;color:#c7c8d4}.tool svg{color:#a1a4bb}.tool small{display:block;font-size:9px;color:#777989;margin-top:5px}.dot{height:5px;width:5px;border-radius:50%;background:#9dbcae;margin-left:auto;flex-shrink:0}.dot.off{background:#62616e}.foot{margin-top:auto;border-top:1px solid #30303a;padding-top:12px;color:#848593;font-size:10px;line-height:1.8}.back{background:none;border:0;color:#bcbfd5;font-size:11px;padding:0 0 15px}.field{display:flex;justify-content:space-between;gap:8px;padding:11px 0;border-bottom:1px solid #ccd0e11b;font-size:11px}.field span:first-child{color:#a8a9bf}.primary{width:100%;margin-top:18px;border:1px solid #ced1e6;border-radius:6px;background:linear-gradient(#e6e8f3,#b9bfd6);color:#292b3b;padding:9px;font-weight:500}.reply{font-size:11px;line-height:1.8;padding:12px 0;color:#c9cadb}.mobile{display:none}.caption{text-align:center;color:#3d4656;font-size:10px;margin-top:11px;letter-spacing:1px}
@media(max-width:720px){.left{width:112px;padding-left:3px;padding-right:3px}.right{width:135px;padding-left:9px;padding-right:9px}.desktop{padding:14px 8px 12px}.canvas{padding:12px}.glass{padding:13px}.numbers strong{font-size:22px}.glass h2{font-size:20px}}
@media(max-width:560px){.left,.right{display:none}.window.showleft .left,.window.showright .right{display:flex;width:100%;min-height:490px}.window.showleft .center,.window.showright .center{display:none}.mobile{display:flex;gap:6px}.mobile button{font-size:10px}.canvas{padding:15px}.desktop{padding:12px 9px}.window{min-height:530px}.glass h2{font-size:23px}.numbers strong{font-size:25px}}
</style></head><body>
<div class="desktop"><div class="window" id="win">
<aside class="left" id="left"></aside>
<main class="center"><div class="top"><div><h1 id="title">工作空间</h1><small>示例企业</small></div><div class="grow"></div><div class="mobile"><button onclick="pane('left')">工作记录</button><button onclick="pane('right')">上下文</button></div><button onclick="go('new')" aria-label="新建工作">＋</button></div>
<div class="canvas"><div class="agent"><span class="light"></span>企业智能体</div><div id="scene"></div><div class="bottom"><div class="chips" id="chips"></div><form class="composer" onsubmit="ask(event)"><button class="add" type="button" onclick="document.getElementById('attach').click()" aria-label="添加附件">＋</button><input type="file" id="attach" hidden onchange="document.getElementById('prompt').placeholder=this.files[0]?'已选择：'+this.files[0].name:'交代一项工作…'"><input id="prompt" placeholder="交代一项工作…" aria-label="工作指令"><button class="send" aria-label="发送">↑</button></form></div></div></main>
<aside class="right" id="right"></aside>
</div><div class="caption">设计预览 · 03.1</div></div>
<script>
const paths={logo:'<path d="m3 20 9-16 9 16h-4l-5-9-5 9z"/>',file:'<path d="M5 3h9l5 5v13H5zM14 3v5h5M8 12h8M8 16h6"/>',money:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18M7 15h4"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/>',data:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/>',chat:'<path d="M3 4h18v13H9l-6 4z"/>'};
function ic(k){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">'+paths[k]+'</svg>'}
let role='owner',view='daily',tab='context',tracked=false;
function pane(p){document.getElementById('win').className='window'+(p?' show'+p:'')}
function nav(){document.getElementById('left').innerHTML='<div class="brand"><span class="logo">'+ic('logo')+'</span>示例企业</div><button class="new" onclick="go(\'new\')">＋　新建工作</button><div class="navlabel">工作记录</div><button class="'+(view==='daily'?'active':'')+'" onclick="go(\'daily\')">今日业务简报</button><button class="'+(view==='paper'?'active':'')+'" onclick="go(\'paper\')">回单跟进</button>'+(role!=='employee'?'<button class="'+(view==='fee'?'active':'')+'" onclick="go(\'fee\')">费用核查</button>':'')+'<div class="navlabel">企业空间</div><button onclick="go(\'data\')">'+ic('data')+'业务数据</button><button onclick="go(\'paper\')">'+ic('clock')+'持续任务</button><div class="profile"><div class="avatar">示</div><select id="roles" aria-label="切换角色"><option value="owner">企业负责人</option><option value="manager">调度管理</option><option value="employee">业务员工</option></select></div><div class="mobile"><button onclick="pane(\'\')">返回工作空间</button></div>';let r=document.getElementById('roles');r.value=role;r.onchange=e=>{role=e.target.value;go('daily')}}
function tool(k,t,s,on=true){return '<div class="tool">'+ic(k)+'<div>'+t+'<small>'+s+'</small></div><span class="dot '+(on?'':'off')+'"></span></div>'}
function right(){document.getElementById('right').innerHTML='<h3>工作上下文</h3><div class="module"><span class="light"></span> 示例企业</div><div class="tabs"><button class="'+(tab==='context'?'active':'')+'" onclick="setTab(\'context\')">上下文</button><button class="'+(tab==='tools'?'active':'')+'" onclick="setTab(\'tools\')">能力</button></div>'+(tab==='context'?'<div class="group">当前任务</div>'+tool('file',view==='daily'?'每日业务巡检':view==='fee'?'费用核查':view==='paper'?'回单跟进':'企业业务','企业工作记录')+tool('data','企业业务数据','已关联')+tool('file','企业规则','当前版本')+'<div class="group">持续工作</div>'+tool('clock','业务巡检','按企业规则')+tool('file','回单追踪','等待更新'):'<div class="group">可用能力</div>'+tool('data','运单查询','业务数据')+tool('file','回单管理','持续跟进')+(role!=='employee'?tool('money','财务核查','授权处理'):'')+tool('clock','定时巡检','企业配置')+tool('chat','微信通知','未接入',false))+'<div class="foot">独立设计预览<br>未连接真实业务系统</div><div class="mobile"><button class="back" onclick="pane(\'\')">返回工作空间</button></div>'}
function setTab(t){tab=t;right()}
function item(k,t,s,v,a=''){return '<button class="item" onclick="go(\''+v+'\')"><span class="itemicon">'+ic(k)+'</span><div class="grow"><b>'+t+'</b><small>'+s+'</small></div><span class="amount">'+a+'</span><span class="arrow">›</span></button>'}
function daily(){return '<div class="time">示例日期 · 09:12</div><div class="glass"><h2>今日业务简报</h2><p>业务巡检已完成。'+(role==='employee'?'有 4 笔回单需要持续跟进。':'发现 2 项费用异常，4 笔回单待收。')+'</p><div class="numbers">'+(role==='employee'?'':'<div><strong>08</strong><small>示例运单</small></div><div><strong>02</strong><small>费用异常</small></div>')+'<div><strong>04</strong><small>待收回单</small></div></div></div><div class="itemslabel">工作事项</div>'+(role!=='employee'?item('money','费用登记差异','DEMO-001 · 示例承运方','fee','¥1,250'):'')+item('file','回单跟进',tracked?'已安排跟进（演示）':'涉及 4 笔运单','paper')+'<p class="note">其余事项将按企业规则持续跟进。</p>'}
function field(k,v){return '<div class="field"><span>'+k+'</span><span>'+v+'</span></div>'}
function detail(){let f=view==='fee';return '<button class="back" onclick="go(\'daily\')">‹ 今日业务简报</button><div class="glass"><h2>'+(f?'费用未落账':'回单未收')+'</h2><p>'+(f?'运单登记金额与费用记录不一致。需核实原始凭证。':'纸质签收回单尚未收齐。可安排持续跟进。')+'</p>'+field('运单编号',f?'DEMO-001':'DEMO-002')+field('相关方',f?'示例承运方':'示例目的地 · 收货方')+(f?field('登记金额','¥1,250.00'):'')+field('事项来源','业务巡检')+'<button class="primary" onclick="handle()">'+(f?'查看处理方案':'安排跟进')+'</button><div id="feedback" class="reply"></div></div>'}
function handle(){if(view==='paper'){tracked=true;document.getElementById('feedback').textContent='已模拟安排跟进，未发送通知。'}else document.getElementById('feedback').textContent='建议核对原始费用凭证。正式系统将通过财务确认流程提交处理。'}
function go(v){if(v==='fee'&&role==='employee')v='daily';view=v;pane('');render()}
function render(){nav();right();document.getElementById('title').textContent={daily:'工作空间',fee:'费用核查',paper:'回单跟进',new:'新建工作',data:'业务数据'}[view];document.getElementById('scene').innerHTML=view==='daily'?daily():view==='fee'||view==='paper'?detail():view==='data'?'<div class="glass"><h2>运单记录</h2>'+(role==='employee'?'':field('DEMO-001','示例货物 · 示例承运方'))+field('DEMO-002','示例货物 · 示例目的地')+'</div>':'<div style="padding:58px 0;text-align:center"><h2 style="font-size:24px;font-weight:400;letter-spacing:-.5px">今天，需要处理什么？</h2><p class="note">查询、分析，或安排一项工作。</p></div>';document.getElementById('chips').innerHTML='<button onclick="fillPrompt(\'检查运单异常\')">业务巡检</button><button onclick="fillPrompt(\'跟进回单\')">回单跟进</button>'+(role==='employee'?'':'<button onclick="fillPrompt(\'核查费用差异\')">费用核查</button>')}
function fillPrompt(s){let p=document.getElementById('prompt');p.value=s;p.focus()}
function ask(e){e.preventDefault();let p=document.getElementById('prompt');if(!p.value.trim())return;let n=document.createElement('div');n.className='reply';n.textContent='已接收演示指令：'+p.value+'。未调用真实 Agent。';document.getElementById('scene').appendChild(n);p.value=''}
render();
</script>
</body></html>
